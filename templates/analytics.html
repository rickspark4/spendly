{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}

<section class="analytics-section">
    <div class="analytics-card">
        <div class="analytics-glow analytics-glow-top"></div>
        <div class="analytics-glow analytics-glow-bottom"></div>

        <div class="analytics-icon">
            <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 10.9991V22L29.3339 25.667M40.3348 22C40.3348 32.126 32.126 40.3348 22 40.3348C11.874 40.3348 3.6652 32.126 3.6652 22C3.6652 11.874 11.874 3.6652 22 3.6652C32.126 3.6652 40.3348 11.874 40.3348 22Z" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>

        <span class="analytics-badge">Coming Soon</span>

        <div class="analytics-text">
            <h1 class="analytics-title">Advanced Analytics</h1>
            <p class="analytics-body">We're working on powerful insights and visualizations to help you understand your spending patterns better.</p>
        </div>

        <div class="analytics-dots">
            <span class="analytics-dot"></span>
            <span class="analytics-dot analytics-dot-active"></span>
            <span class="analytics-dot"></span>
        </div>

        <p class="analytics-caption">We're crafting something special</p>
    </div>
</section>

{% endblock %}
